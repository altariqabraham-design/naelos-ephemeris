name: ci
on:
  push:
  pull_request:
# Read-only: the workflow only tests. (Security review, 2026-10-20.)
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 18 stays while package.json promises node >=18; 24 is the current LTS.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The built package must load in plain Node, with no TypeScript step.
      - run: node -e "import('./dist/index.js').then(m => { const e = m.NaelosEphemeris.fromBuffers([require('fs').readFileSync('data/ne-2000.bin')]); const r = e.calc_ut(m.julday(2026, 1, 1, 12), m.SE_MARS, 0); if ('error' in r) throw new Error(r.error); console.log('Mars', r.longitude.toFixed(4)); })"
        shell: bash
